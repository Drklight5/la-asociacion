<!doctype html>
<html lang="es">
<head>

<title>La Asociación — visual EEG</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05050a; overflow: hidden; }

    position: fixed; left: 14px; bottom: 12px; z-index: 10;

  <code>curl -L https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js -o p5.min.js</code>

<script
